name: Docs

on:
  pull_request:
    paths:
      - 'site/**'
      - 'src/**'
      - 'typedoc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'src/**'
      - 'typedoc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API reference
        run: pnpm run docs

      - name: Build docs site
        run: pnpm docs:build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: site/dist/public
          if-no-files-found: error
          retention-days: 7
